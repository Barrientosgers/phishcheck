name: CI

on:
  push:
  pull_request:
  workflow_dispatch: # lets you re-run it by hand from the Actions tab

# Least privilege: every job can only read the repo unless it asks for more below.
permissions:
  contents: read

jobs:
  check:
    name: Lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      # `npm ci` installs exactly what package-lock.json says, so CI matches your machine.
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test # includes the accuracy floors in tests/accuracy.test.ts
      - run: npm run build # also runs the TypeScript check (tsc -b)

      - name: Upload site for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    # Only after every check passed, and only for pushes to main.
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write # publish to GitHub Pages
      id-token: write # prove to Pages that this run comes from this repo
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never run two deploys at once; a newer push cancels an older one still waiting.
    concurrency:
      group: pages
      cancel-in-progress: true
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
